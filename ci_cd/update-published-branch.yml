.update-published-branch-base:
  stage: publish
  dependencies: [] # Don't download artifacts
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ $PEP_FOSS_PUBLISHED_BRANCH_PATTERN'
      when: always
    - when: never
  tags:
    - docker-small
  image: alpine:latest

push-published-branch-to-github:
  extends: .update-published-branch-base
  before_script:
    - apk update -qq && apk add --no-cache git
    - git config --global color.ui always

    # Do not put tokens in the remote URLs, to prevent them from being printed on fetch/push
    - git config --global "credential.$CI_SERVER_URL.username" gitlab-ci-token
    - git config --global "credential.$CI_SERVER_URL.helper" '!f() { [ "$1" = get ] && echo "password=$CI_JOB_TOKEN"; }; f'
    - git config --global "credential.https://github.com.username" pep-team
    - git config --global "credential.https://github.com.helper" '!f() { [ "$1" = get ] && echo "password=$GITHUB_ACCESS_TOKEN"; }; f'

    - git remote remove gitlab >/dev/null 2>&1 || true
    - git remote add gitlab "${CI_SERVER_URL}/pep/core.git"
    - git remote remove github >/dev/null 2>&1 || true
    - git remote add github "https://github.com/PEP-Repository/core.git"

  script:
    - set -eu

    # Fetch the target branch at the start so that the final `git push --force-with-lease` fails if it changed
    - git fetch github "${CI_COMMIT_REF_NAME}"
    # Make sure the local version of the published branch is up to date
    - |
      git branch -D "${CI_COMMIT_REF_NAME}" 2>/dev/null || true
      git fetch --unshallow gitlab "${CI_COMMIT_REF_NAME}"
      git checkout -b "${CI_COMMIT_REF_NAME}" "gitlab/${CI_COMMIT_REF_NAME}"

    - |
      echo 'Root commits:'
      git rev-list --max-parents=0 HEAD
    - |
      readonly NR_OF_ROOT_COMMITS="$(git rev-list --max-parents=0 HEAD | wc -l)"
      readonly TIMESTAMP_OF_EARLIEST_COMMIT="$(git log --reverse --format=%at -n 1 HEAD)"
      readonly EARLIEST_ALLOWED_TIMESTAMP="$(date -d "2025-01-01" +%s)"
    - |
      if [ "${TIMESTAMP_OF_EARLIEST_COMMIT}" -lt "${EARLIEST_ALLOWED_TIMESTAMP}" ]; then
        >&2 echo "Error: The current branch contains commits that were created before we went open source. Aborting"
        exit 1
      fi
    - |
      if [ "${NR_OF_ROOT_COMMITS}" -ne 1 ]; then
        >&2 echo "Error: The current branch has more than one root commit. Aborting"
        exit 1
      fi
    - git push --force-with-lease github

